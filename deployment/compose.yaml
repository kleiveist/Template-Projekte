name: template-project

services:
  frontend:
    image: template-project/frontend:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "${FRONTEND_CONTAINER_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    image: template-project/backend:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: deployment/docker/backend.Dockerfile
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-Template Project API}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://tauri.localhost,tauri://localhost}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:16.15-alpine3.24
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
