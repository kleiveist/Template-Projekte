schema_version = 1

[core]
paths = [
  "README.md",
  ".env.example",
  ".gitignore",
  "docs",
  "profiles",
  "shared",
  "tools",
]

[features.frontend]
name = "Frontend"
description = "Vite and TypeScript browser frontend"
paths = ["frontend"]

[features.backend]
name = "Backend"
description = "FastAPI backend service"
paths = ["backend"]

[features.tauri]
name = "Tauri"
description = "Tauri desktop shell and Rust application scaffold"
paths = ["src-tauri"]
requires = ["frontend"]

[features.cloud]
name = "Cloud"
description = "Cloud-ready deployment profile metadata"
paths = []
requires = ["backend"]
