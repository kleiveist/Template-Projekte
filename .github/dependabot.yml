version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      backend-python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      tooling-python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      tauri-rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/tools/quality/rust_analyzer"
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      analyzer-rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/deployment/docker"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      dockerfile-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: "/deployment"
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      compose-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
