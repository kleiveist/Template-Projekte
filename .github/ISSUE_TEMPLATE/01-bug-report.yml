name: Bug report
description: Report a reproducible problem in the template or an enabled project profile.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Do not include secrets or personal data. Security vulnerabilities must use the private route in the [Security Policy](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Affected version or commit
      description: State the version, release tag, or commit that shows the problem.
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Affected project profile
      description: Select the profile where the problem occurs.
      options:
        - web-only
        - web-cloud
        - desktop-local
        - desktop-cloud
        - full-platform
        - Not profile-specific
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and relevant Python, Node.js, Rust, browser, Docker, or PostgreSQL versions.
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites and setup state
      description: Describe the selected profile, optional capabilities, configuration, and completed setup steps.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happened instead, including complete error messages when useful.
    validations:
      required: true
  - type: textarea
    id: logs-and-screenshots
    attributes:
      label: Logs and screenshots
      description: Add sanitized logs, stack traces, or screenshots if they clarify the problem.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add anything else that could help investigate the problem.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues before submitting this report.
          required: true
        - label: I removed secrets and unnecessary personal data from this report.
          required: true
        - label: I agree to follow this project's [Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true
