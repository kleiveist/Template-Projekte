name: Feature request
description: Propose a focused improvement to the template or its project profiles.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are public. Do not include secrets or report security vulnerabilities here; use the private route in the [Security Policy](https://github.com/kleiveist/Template-Projekte/security/policy).
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: Describe the user or maintainer problem that this request would solve.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the intended behavior or change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches, workarounds, or why none are suitable.
    validations:
      required: true
  - type: dropdown
    id: affected-profiles
    attributes:
      label: Affected profiles or components
      description: Select every applicable profile or choose the most accurate scope.
      multiple: true
      options:
        - web-only
        - web-cloud
        - desktop-local
        - desktop-cloud
        - full-platform
        - Shared tooling or documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: Explain who benefits and how the change improves the template.
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Breaking changes or migration impact
      description: Identify the expected compatibility impact.
      options:
        - No known breaking change
        - Potential breaking change
        - Migration likely required
        - Not sure
    validations:
      required: true
  - type: textarea
    id: compatibility-details
    attributes:
      label: Compatibility details
      description: Explain the expected breaking change or migration, if any.
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add designs, references, constraints, or other useful context.
    validations:
      required: false
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/kleiveist/Template-Projekte/blob/main/CODE_OF_CONDUCT.md).
          required: true
