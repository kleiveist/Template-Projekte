name: Core CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    name: Core / Tooling, Profiles & Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install tooling dependencies
        run: python tools/control.py install --skip-frontend --skip-backend --skip-playwright
      - name: Validate runtime configuration
        env:
          DATABASE_URL: postgresql+psycopg://template_test:test-password@127.0.0.1:5432/template_test
        run: python tools/control.py config doctor
      - name: Run tooling, profile, and configuration tests
        run: python tools/control.py test --suite tools
      - name: Verify repository files are unchanged
        run: git diff --exit-code

  backend:
    name: Core / Backend, Database & Schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            backend/requirements.txt
            backend/requirements-database.txt
            backend/requirements-postgres.txt
      - name: Install backend dependencies
        run: python tools/control.py install --skip-frontend --skip-tooling --skip-playwright
      - name: Run schema tests
        run: python tools/control.py test --suite schema
      - name: Run backend API tests
        run: python tools/control.py test --suite api
      - name: Run database unit tests
        run: python tools/control.py test --suite database
      - name: Verify repository files are unchanged
        run: git diff --exit-code

  frontend:
    name: Core / Frontend & Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: python tools/control.py install --skip-backend --skip-tooling --skip-playwright
      - name: Run frontend tests
        run: python tools/control.py test --suite frontend
      - name: Build production web bundle
        run: python tools/control.py build web
      - name: Verify repository files are unchanged
        run: git diff --exit-code

  desktop:
    name: Core / Tauri & Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-
            ${{ runner.os }}-cargo-
      - name: Install frontend dependencies
        run: python tools/control.py install --skip-backend --skip-tooling --skip-playwright
      - name: Install Tauri system dependencies
        run: python tools/control.py tauri install --skip-rust --skip-node --skip-frontend
      - name: Run Tauri doctor
        env:
          DATABASE_URL: postgresql+psycopg://template_test:test-password@127.0.0.1:5432/template_test
        run: python tools/control.py tauri doctor
      - name: Run Tauri and Rust tests
        run: python tools/control.py test --suite tauri
      - name: Verify repository files are unchanged
        run: git diff --exit-code
