name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      linux_bundles:
        description: Comma-separated unsigned Linux bundle targets
        required: false
        default: deb
        type: string
  workflow_call:
    inputs:
      linux_bundles:
        description: Comma-separated unsigned Linux bundle targets
        required: false
        default: deb
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-build:
    name: Desktop / ${{ matrix.label }} / Unsigned Verification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            target: linux
            bundles: deb
          - label: macOS
            os: macos-latest
            target: macos
            bundles: all
          - label: Windows
            os: windows-latest
            target: windows
            bundles: all
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust 1.97.1
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-
            ${{ runner.os }}-cargo-
      - name: Install portable tooling runtime
        run: python tools/control.py install --skip-backend --skip-frontend --skip-playwright
      - name: Verify Windows batch launcher execution
        if: matrix.target == 'windows'
        run: tools\.venv\Scripts\python.exe -m pytest -q tools/tests/test_process.py
      - name: Install frontend dependencies
        run: python tools/control.py install --skip-backend --skip-tooling --skip-playwright
      - name: Install native Tauri prerequisites
        run: python tools/control.py tauri install --skip-rust --skip-node --skip-frontend
      - name: Verify the portable Rust analyzer runtime
        env:
          DATABASE_URL: postgresql+psycopg://template_test:test-password@127.0.0.1:5432/template_test
        run: python tools/control.py doctor
      - name: Verify UTF-8 Rust analyzer transport
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TOOLING_PYTHON="tools/.venv/Scripts/python.exe"
          else
            TOOLING_PYTHON="tools/.venv/bin/python"
          fi
          "$TOOLING_PYTHON" -m pytest -q \
            tools/tests/quality/test_rust_syntax.py::test_subprocess_transport_is_utf8_when_child_text_stdio_is_cp1252
      - name: Run Tauri doctor
        run: python tools/control.py tauri doctor
      - name: Run Tauri and Rust tests
        run: python tools/control.py test --suite tauri
      - name: Build unsigned native package
        if: matrix.target != 'linux'
        run: python tools/control.py build desktop --target ${{ matrix.target }}
      - name: Build unsigned Linux packages
        if: matrix.target == 'linux'
        env:
          LINUX_BUNDLES: ${{ inputs.linux_bundles || matrix.bundles }}
        run: python tools/control.py build desktop --target linux --bundles "$LINUX_BUNDLES"
      - name: Verify unsigned Linux packages
        if: matrix.target == 'linux'
        env:
          LINUX_BUNDLES: ${{ inputs.linux_bundles || matrix.bundles }}
        run: |
          python tools/control.py tauri verify-artifacts \
            --target linux \
            --bundles "$LINUX_BUNDLES" \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}-unsigned
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
            .dist/desktop/linux/linux-bundles.json
            .dist/desktop/linux/SHA256SUMS
      - name: Verify repository files are unchanged
        shell: bash
        run: git diff --exit-code
