name: Profile Matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generated-project:
    name: Profiles / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      # Report every broken preset in one run instead of hiding failures behind the first result.
      fail-fast: false
      matrix:
        include:
          - profile: web-only
            desktop: false
            cloud: false
          - profile: web-cloud
            desktop: false
            cloud: true
          - profile: desktop-local
            desktop: true
            cloud: false
          - profile: desktop-cloud
            desktop: true
            cloud: true
          - profile: full-platform
            desktop: true
            cloud: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            backend/requirements.txt
            backend/requirements-database.txt
            backend/requirements-postgres.txt
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust 1.97.1
        if: matrix.desktop
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Generate profile project
        run: >-
          python tools/control.py init
          --profile ${{ matrix.profile }}
          --target-dir .generated/ci-${{ matrix.profile }}
      - name: Verify generated template lifecycle
        working-directory: .generated/ci-${{ matrix.profile }}
        run: |
          python tools/control.py template status
          python tools/control.py template verify
          python tools/control.py template status --format json | python -c '
          import json, sys
          status = json.load(sys.stdin)
          assert status["provenance"] == "generated"
          assert status["source_reproducible"] is True
          assert status["baseline_manifest"] == "valid"
          '
      - name: Cache Cargo dependencies
        if: matrix.desktop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .generated/ci-${{ matrix.profile }}/src-tauri/target
          key: ${{ runner.os }}-cargo-profile-${{ matrix.profile }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-profile-${{ matrix.profile }}-
            ${{ runner.os }}-cargo-
      - name: Inspect generated project structure
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py doctor
      - name: Validate generated runtime configuration
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py config doctor
      - name: Install generated project dependencies
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py install --skip-playwright
      - name: Install generated Playwright Chromium and system dependencies
        working-directory: .generated/ci-${{ matrix.profile }}/frontend
        run: npx playwright install --with-deps chromium
      - name: Install generated Tauri system dependencies
        if: matrix.desktop
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py tauri install --skip-rust --skip-node --skip-frontend
      - name: Run generated project quality gate
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py quality
      - name: Diagnose generated project
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py doctor
      - name: Diagnose generated Tauri project
        if: matrix.desktop
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py tauri doctor
      - name: Validate generated desktop build command
        if: matrix.desktop
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py build desktop --dry-run --no-clean
      - name: Test generated project
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py test --suite all
      - name: Build generated web bundle
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py build web
      - name: Validate generated container model
        if: matrix.cloud
        working-directory: .generated/ci-${{ matrix.profile }}
        run: python tools/control.py container validate
      - name: Verify repository files are unchanged
        run: git diff --exit-code
