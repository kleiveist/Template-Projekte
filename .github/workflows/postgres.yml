name: PostgreSQL Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: PostgreSQL / Integration & Migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/template_test
      DATABASE_URL_TEST: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/template_test
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            backend/requirements.txt
            backend/requirements-database.txt
            backend/requirements-postgres.txt
      - name: Install backend and PostgreSQL dependencies
        run: python tools/control.py install --skip-frontend --skip-tooling --skip-playwright
      - name: Validate test configuration
        run: python tools/control.py config doctor
      - name: Upgrade empty PostgreSQL database
        run: python tools/control.py db upgrade
      - name: Run PostgreSQL integration tests
        run: python tools/control.py test --suite postgres
      - name: Verify repository files are unchanged
        run: git diff --exit-code

  generated-postgres:
    name: Profiles / ${{ matrix.profile }} + postgres
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: web-cloud
            desktop: false
          - profile: desktop-cloud
            desktop: true
          - profile: full-platform
            desktop: true
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/template_test
      DATABASE_URL_TEST: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/template_test
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            backend/requirements.txt
            backend/requirements-database.txt
            backend/requirements-postgres.txt
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust 1.97.1
        if: matrix.desktop
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Generate PostgreSQL profile project
        run: >-
          python tools/control.py init
          --profile ${{ matrix.profile }}
          --with postgres
          --target-dir .generated/ci-${{ matrix.profile }}-postgres
      - name: Verify generated template lifecycle
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: |
          python tools/control.py template status
          python tools/control.py template verify
          python tools/control.py template status --format json | python -c '
          import json, sys
          status = json.load(sys.stdin)
          assert status["provenance"] == "generated"
          assert status["source_reproducible"] is True
          assert status["baseline_manifest"] == "valid"
          '
      - name: Inspect generated project structure
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py doctor
      - name: Validate generated runtime configuration
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py config doctor
      - name: Install generated project dependencies
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py install --skip-playwright
      - name: Install generated Tauri system dependencies
        if: matrix.desktop
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py tauri install --skip-rust --skip-node --skip-frontend
      - name: Run generated project quality gate
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py quality
      - name: Diagnose generated project
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py doctor
      - name: Diagnose generated Tauri project
        if: matrix.desktop
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py tauri doctor
      - name: Validate generated desktop build command
        if: matrix.desktop
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py build desktop --dry-run --no-clean
      - name: Upgrade generated project database
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py db upgrade
      - name: Test generated project
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py test --suite all
      - name: Build generated web bundle
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py build web
      - name: Validate generated container model
        working-directory: .generated/ci-${{ matrix.profile }}-postgres
        run: python tools/control.py container validate
      - name: Verify repository files are unchanged
        run: git diff --exit-code
